spring.application.name=budget
server.port=${PORT:8080}
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

app.security.oauth-enabled=${APP_OAUTH_ENABLED:false}
app.security.allowed-github-login=${APP_ALLOWED_GITHUB_LOGIN:}
app.database.url=${DATABASE_URL:}
app.upload.max-bytes=12582912
app.local-import.root=.
spring.flyway.baseline-on-migrate=true
