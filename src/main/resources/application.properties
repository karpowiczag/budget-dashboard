spring.application.name=budget
server.port=${PORT:8080}
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

app.security.oauth-enabled=${APP_OAUTH_ENABLED:false}
app.security.allowed-google-email=${APP_ALLOWED_GOOGLE_EMAIL:}
app.database.url=${DATABASE_URL:}
app.database.allow-local-h2=${APP_ALLOW_LOCAL_H2:false}
app.upload.max-bytes=12582912
app.local-import.root=.
app.local-import.rebuild-enabled=${APP_LOCAL_REBUILD_ENABLED:true}
app.budget-settings.target-monthly-spend=${APP_TARGET_MONTHLY_SPEND:14000}
app.budget-settings.aggressive-monthly-spend=${APP_AGGRESSIVE_MONTHLY_SPEND:13000}
app.budget-settings.emergency-fund-min-months=${APP_EMERGENCY_FUND_MIN_MONTHS:3}
app.budget-settings.emergency-fund-comfort-months=${APP_EMERGENCY_FUND_COMFORT_MONTHS:6}
app.fire.reports-path=${APP_FIRE_REPORTS_PATH:fire/investments_reports}
app.fire.current-age=${APP_FIRE_CURRENT_AGE:36}
app.fire.target-age=${APP_FIRE_TARGET_AGE:50}
app.fire.safe-withdrawal-rate=${APP_FIRE_SAFE_WITHDRAWAL_RATE:0.035}
app.fire.pessimistic-real-return=${APP_FIRE_PESSIMISTIC_REAL_RETURN:0.02}
app.fire.expected-real-return=${APP_FIRE_EXPECTED_REAL_RETURN:0.04}
app.fire.optimistic-real-return=${APP_FIRE_OPTIMISTIC_REAL_RETURN:0.055}
app.fire.target-equity-share=${APP_FIRE_TARGET_EQUITY_SHARE:0.80}
app.fire.target-bond-share=${APP_FIRE_TARGET_BOND_SHARE:0.10}
app.fire.target-cash-share=${APP_FIRE_TARGET_CASH_SHARE:0.05}
app.fire.target-alternative-share=${APP_FIRE_TARGET_ALTERNATIVE_SHARE:0.05}
app.fire.rebalance-band=${APP_FIRE_REBALANCE_BAND:0.05}
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
