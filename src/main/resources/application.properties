spring.application.name=budget
server.port=${PORT:8080}
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

app.security.oauth-enabled=${APP_OAUTH_ENABLED:false}
app.security.allowed-google-email=${APP_ALLOWED_GOOGLE_EMAIL:}
app.database.url=${DATABASE_URL:}
app.upload.max-bytes=12582912
app.local-import.root=.
app.local-import.rebuild-enabled=${APP_LOCAL_REBUILD_ENABLED:true}
app.budget-settings.target-monthly-spend=${APP_TARGET_MONTHLY_SPEND:14000}
app.budget-settings.aggressive-monthly-spend=${APP_AGGRESSIVE_MONTHLY_SPEND:13000}
app.budget-settings.emergency-fund-min-months=${APP_EMERGENCY_FUND_MIN_MONTHS:3}
app.budget-settings.emergency-fund-comfort-months=${APP_EMERGENCY_FUND_COMFORT_MONTHS:6}
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
