openapi: 3.1.0
info:
  title: Budget Dashboard API
  version: 1.0.0
  description: Contract-first API for the household budget dashboard.
servers:
  - url: /
paths:
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/years:
    get:
      operationId: listYears
      responses:
        "200":
          description: Imported report years.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YearSummary"
  /api/v1/reports/{year}/dashboard:
    get:
      operationId: getReportDashboard
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Snapshot dashboard without embedded transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/reports/{year}/calendar:
    get:
      operationId: getReportCalendar
      parameters:
        - $ref: "#/components/parameters/Year"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Day-level month calendar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/reports/{year}/analytics:
    get:
      operationId: getReportAnalytics
      parameters:
        - $ref: "#/components/parameters/Year"
        - name: scope
          in: query
          schema:
            type: string
            enum: [year, month, day]
            default: year
        - name: month
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/AreaFilter"
        - $ref: "#/components/parameters/GroupFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/SubcategoryFilter"
        - name: fixedness
          in: query
          schema:
            type: string
            maxLength: 160
        - name: confidence
          in: query
          schema:
            type: string
            enum: [Wysoka, Średnia, Niska]
      responses:
        "200":
          description: Scoped analytics and drilldown aggregates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/reports/{year}/transactions:
    get:
      operationId: listReportTransactions
      parameters:
        - $ref: "#/components/parameters/Year"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          schema:
            type: string
            default: postedDate,desc
            enum: [postedDate,desc, postedDate,asc, amount,desc, amount,asc, spend,desc, spend,asc, merchant,asc, merchant,desc, category,asc, category,desc, subcategory,asc, subcategory,desc, bucket,asc, bucket,desc, fixedness,asc, fixedness,desc, confidence,asc, confidence,desc, reviewStatus,asc, reviewStatus,desc]
        - name: month
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: query
          in: query
          schema:
            type: string
            maxLength: 160
        - name: flow
          in: query
          description: High-level transaction flow filter for drill-down views.
          schema:
            type: string
            enum: [income, spend, livingExpense, excluded, financial, wealthTransfer, technicalTransfer, refundCorrection, review]
        - name: bucket
          in: query
          schema:
            type: string
            maxLength: 160
        - $ref: "#/components/parameters/AreaFilter"
        - $ref: "#/components/parameters/GroupFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/SubcategoryFilter"
        - name: fixedness
          in: query
          schema:
            type: string
            maxLength: 160
        - name: confidence
          in: query
          schema:
            type: string
            enum: [Wysoka, Średnia, Niska]
        - name: reviewStatus
          in: query
          schema:
            type: string
            enum: [ok, needsReview, needsSplit]
      responses:
        "200":
          description: Paginated normalized transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/reports/{year}/transactions/{id}/recategorize:
    post:
      operationId: recategorizeTransaction
      parameters:
        - $ref: "#/components/parameters/Year"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecategorizeRequest"
      responses:
        "200":
          description: Recategorize acknowledgement; the year is re-analyzed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecategorizeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/imports/uploads:
    post:
      operationId: uploadImportCsv
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/imports/rebuild:
    post:
      operationId: rebuildImports
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Rebuild result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/imports/runs:
    get:
      operationId: listImportRuns
      responses:
        "200":
          description: Recent import audit runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"
  /api/v1/settings/budget:
    get:
      operationId: getBudgetSettings
      responses:
        "200":
          description: Current global budget settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSettings"
    put:
      operationId: updateBudgetSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetSettings"
      responses:
        "200":
          description: Updated global budget settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSettings"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/fire/summary:
    get:
      operationId: getFireSummary
      responses:
        "200":
          description: FIRE tracking summary based on local MyFund portfolio reports and budget snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSummary"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/fire/settings:
    get:
      operationId: getFireSettings
      responses:
        "200":
          description: Current FIRE planning settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSettings"
    put:
      operationId: updateFireSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FireSettings"
      responses:
        "200":
          description: Updated FIRE planning settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSettings"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/networth:
    get:
      operationId: getNetWorth
      responses:
        "200":
          description: Liquid account balances (derived from anchor + transaction flows) and emergency-fund coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/networth/accounts/{key}:
    put:
      operationId: updateNetWorthAccount
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            maxLength: 190
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpsertRequest"
      responses:
        "200":
          description: Net-worth overview after saving the account configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/networth/liabilities/{key}:
    put:
      operationId: updateNetWorthLiability
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            maxLength: 190
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiabilityUpsertRequest"
      responses:
        "200":
          description: Net-worth overview after saving the liability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthResponse"
        "400":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNetWorthLiability
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            maxLength: 190
      responses:
        "200":
          description: Net-worth overview after removing the liability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/goals:
    get:
      operationId: listGoals
      responses:
        "200":
          description: Financial goals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/goals/{id}:
    put:
      operationId: updateGoal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 190
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpsertRequest"
      responses:
        "200":
          description: Goals after saving.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGoal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 190
      responses:
        "200":
          description: Goals after removing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: User-owned categories and groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/categories/{id}:
    put:
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpsertRequest"
      responses:
        "200":
          description: Categories after saving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 80
        - name: reassignTo
          in: query
          description: Target category id to reassign rules/transactions/overrides onto (required to delete).
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Categories after deleting/merging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/categories/groups/{id}:
    put:
      operationId: updateCategoryGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryGroupUpsertRequest"
      responses:
        "200":
          description: Categories after renaming a group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/categories/reorder:
    post:
      operationId: reorderCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryReorderRequest"
      responses:
        "200":
          description: Categories after reordering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/categories/rules/{id}:
    put:
      operationId: updateCategoryRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleUpsertRequest"
      responses:
        "200":
          description: Categories after saving a rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCategoryRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Categories after deleting a rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AreaFilter:
      name: area
      in: query
      schema:
        type: string
        maxLength: 160
    GroupFilter:
      name: group
      in: query
      schema:
        type: string
        maxLength: 160
    CategoryFilter:
      name: category
      in: query
      schema:
        type: string
        maxLength: 160
    SubcategoryFilter:
      name: subcategory
      in: query
      schema:
        type: string
        maxLength: 160
  responses:
    Problem:
      description: RFC 9457 problem detail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    Money:
      type: number
      multipleOf: 0.01
    Ratio:
      type: number
      multipleOf: 0.0001
    SessionResponse:
      type: object
      required: [authenticated, name]
      properties:
        authenticated:
          type: boolean
        name:
          type: string
    YearSummary:
      type: object
      required: [year, importedAt, transactions, income, spend]
      properties:
        year:
          type: integer
        importedAt:
          type: string
          format: date-time
        transactions:
          type: integer
        income:
          $ref: "#/components/schemas/Money"
        spend:
          $ref: "#/components/schemas/Money"
        inputCsv:
          type: string
    DashboardResponse:
      type: object
      required: [year, period, periodStart, periodEnd, activeMonths, kpis, monthly, categories, hierarchy, budgetMix, savingsPlan, monthControl, fixedness, topMerchants, recurring, largeOneoffs]
      properties:
        year:
          type: integer
        period:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        activeMonths:
          type: integer
        kpis:
          $ref: "#/components/schemas/Kpis"
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/MonthlySummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
        hierarchy:
          type: array
          items:
            $ref: "#/components/schemas/HierarchySummary"
        budgetMix:
          type: array
          items:
            $ref: "#/components/schemas/BudgetMixItem"
        savingsPlan:
          $ref: "#/components/schemas/SavingsPlan"
        monthControl:
          $ref: "#/components/schemas/MonthControl"
        fixedness:
          type: array
          items:
            $ref: "#/components/schemas/FixednessSummary"
        topMerchants:
          type: array
          items:
            $ref: "#/components/schemas/MerchantSummary"
        recurring:
          type: array
          items:
            $ref: "#/components/schemas/RecurringItem"
        largeOneoffs:
          type: array
          items:
            $ref: "#/components/schemas/LargeOneOff"
    Kpis:
      type: object
      required: [income, spend, discretionary, operatingSurplus, savingsRate, excludedGross, excludedOutgoing, excludedIncoming, excludedNet, realSavingsOutgoing, unassignedSurplus, transactions, corrections, lowConfidence, toCheck, toCheckAmount, savingsAccountNetChange, savingsAccountGrossDeposits, savingsAccountInflows, savingsAccountOutflows]
      properties:
        income:
          $ref: "#/components/schemas/Money"
        spend:
          $ref: "#/components/schemas/Money"
        discretionary:
          $ref: "#/components/schemas/Money"
        operatingSurplus:
          $ref: "#/components/schemas/Money"
        savingsRate:
          $ref: "#/components/schemas/Ratio"
        excludedGross:
          $ref: "#/components/schemas/Money"
        excludedOutgoing:
          $ref: "#/components/schemas/Money"
        excludedIncoming:
          $ref: "#/components/schemas/Money"
        excludedNet:
          $ref: "#/components/schemas/Money"
        realSavingsOutgoing:
          $ref: "#/components/schemas/Money"
        unassignedSurplus:
          $ref: "#/components/schemas/Money"
        transactions:
          type: integer
        corrections:
          type: integer
        lowConfidence:
          type: integer
        toCheck:
          type: integer
        toCheckAmount:
          $ref: "#/components/schemas/Money"
        savingsAccountNetChange:
          $ref: "#/components/schemas/Money"
        savingsAccountGrossDeposits:
          $ref: "#/components/schemas/Money"
        savingsAccountInflows:
          $ref: "#/components/schemas/Money"
        savingsAccountOutflows:
          $ref: "#/components/schemas/Money"
    MonthlySummary:
      type: object
      required: [month, monthKey, income, spend, discretionary, excluded, savingsInvestments, netFlow, savingsRate, transactions, spendPerDay]
      properties:
        month:
          type: string
        monthKey:
          type: string
        income:
          $ref: "#/components/schemas/Money"
        spend:
          $ref: "#/components/schemas/Money"
        discretionary:
          $ref: "#/components/schemas/Money"
        excluded:
          $ref: "#/components/schemas/Money"
        savingsInvestments:
          $ref: "#/components/schemas/Money"
        netFlow:
          $ref: "#/components/schemas/Money"
        savingsRate:
          $ref: "#/components/schemas/Ratio"
        transactions:
          type: integer
        spendPerDay:
          $ref: "#/components/schemas/Money"
    CategorySummary:
      type: object
      required: [category, group, spend, income, excluded, monthlyAverage, maxAmount, discretionary, count, merchantExamples]
      properties:
        category:
          type: string
        group:
          type: string
        spend:
          $ref: "#/components/schemas/Money"
        income:
          $ref: "#/components/schemas/Money"
        excluded:
          $ref: "#/components/schemas/Money"
        monthlyAverage:
          $ref: "#/components/schemas/Money"
        maxMonth:
          type: string
          nullable: true
        maxAmount:
          $ref: "#/components/schemas/Money"
        discretionary:
          type: boolean
        count:
          type: integer
        merchantExamples:
          type: array
          items:
            type: string
    HierarchySummary:
      type: object
      required: [area, group, category, subcategory, spend, income, excluded, monthlyAverage, count, discretionary]
      properties:
        area:
          type: string
        group:
          type: string
        category:
          type: string
        subcategory:
          type: string
        spend:
          $ref: "#/components/schemas/Money"
        income:
          $ref: "#/components/schemas/Money"
        excluded:
          $ref: "#/components/schemas/Money"
        monthlyAverage:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
        discretionary:
          type: boolean
    BudgetMixItem:
      type: object
      required: [bucket, sum, monthlyAverage, incomeShare, note]
      properties:
        bucket:
          type: string
        sum:
          $ref: "#/components/schemas/Money"
        monthlyAverage:
          $ref: "#/components/schemas/Money"
        incomeShare:
          $ref: "#/components/schemas/Ratio"
        note:
          type: string
    SavingsPlan:
      type: object
      required: [currentMonthlySpend, currentMonthlyIncome, coreMonthlyCost, targetMonthlySpend, aggressiveMonthlySpend, targetInvestmentTransfer, aggressiveInvestmentTransfer, monthlyCutNeeded, emergencyFundMin, emergencyFundComfort, parentLimits, categoryLimits]
      properties:
        currentMonthlySpend:
          $ref: "#/components/schemas/Money"
        currentMonthlyIncome:
          $ref: "#/components/schemas/Money"
        coreMonthlyCost:
          $ref: "#/components/schemas/Money"
        targetMonthlySpend:
          description: Current household budget spending target, exposed only as budget context. It does not drive the FIRE spending target.
          $ref: "#/components/schemas/Money"
        aggressiveMonthlySpend:
          $ref: "#/components/schemas/Money"
        targetInvestmentTransfer:
          $ref: "#/components/schemas/Money"
        aggressiveInvestmentTransfer:
          $ref: "#/components/schemas/Money"
        monthlyCutNeeded:
          $ref: "#/components/schemas/Money"
        emergencyFundMin:
          $ref: "#/components/schemas/Money"
        emergencyFundComfort:
          $ref: "#/components/schemas/Money"
        parentLimits:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLimit"
        categoryLimits:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLimit"
    CategoryLimit:
      type: object
      required: [scope, name, parent, category, bucket, currentMonthly, limit, potentialMonthly, potentialYearly, priority, action]
      properties:
        scope:
          type: string
          enum: [bucket, area, group, category]
        name:
          type: string
        parent:
          type: boolean
        category:
          type: string
        bucket:
          type: string
        currentMonthly:
          $ref: "#/components/schemas/Money"
        limit:
          $ref: "#/components/schemas/Money"
        potentialMonthly:
          $ref: "#/components/schemas/Money"
        potentialYearly:
          $ref: "#/components/schemas/Money"
        priority:
          type: string
        action:
          type: string
    MonthControl:
      type: object
      required: [month, monthKey, elapsedDays, remainingDays, daysInMonth, incomeToDate, spendToDate, projectedSpend, targetSpend, remainingBudget, dailyAllowed, projectedDelta, categoryStatus, alerts, sinkingFunds]
