    NetWorthAccount:
      type: object
      required: [accountKey, name, kind, liquid, excludeFromNetWorth, configured]
      properties:
        accountKey:
          type: string
        name:
          type: string
        kind:
          type: string
        liquid:
          type: boolean
        excludeFromNetWorth:
          type: boolean
        configured:
          type: boolean
        anchorBalance:
          description: Known balance at anchorDate; absent until an opening balance is set.
          $ref: "#/components/schemas/Money"
        anchorDate:
          type: string
          format: date
        netFlowSinceAnchor:
          description: Net of signed transaction amounts posted after anchorDate.
          $ref: "#/components/schemas/Money"
        derivedBalance:
          description: anchorBalance + netFlowSinceAnchor; absent until configured.
          $ref: "#/components/schemas/Money"
        statementBalance:
          description: Optional later observed balance (e.g. from a statement) used for reconciliation.
          $ref: "#/components/schemas/Money"
        statementDate:
          type: string
          format: date
        reconciledBalance:
          description: Derived balance at statementDate; absent unless a statement is set.
          $ref: "#/components/schemas/Money"
        drift:
          description: reconciledBalance − statementBalance; absent unless a statement is set.
          $ref: "#/components/schemas/Money"
        reconciled:
          type: boolean
