name: budget-dashboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - budget-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_OAUTH_ENABLED: "false"
      APP_LOCAL_REBUILD_ENABLED: "false"
      DATABASE_URL: "postgresql://budget:budget@postgres:5432/budget?sslmode=disable"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  budget-postgres-data:
