name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      - run: npm ci
      - run: npm run build
      - run: npm run sync:frontend
      - run: ./mvnw test
