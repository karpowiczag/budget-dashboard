name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to publish'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/budget
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      - run: npm ci
      - run: npm run build
      - run: npm run sync:frontend
      - run: ./mvnw -Pnative -DskipTests native:compile

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Install Koyeb CLI
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_APP: ${{ secrets.KOYEB_APP }}
          KOYEB_SERVICE: ${{ secrets.KOYEB_SERVICE }}
        run: |
          if [ -z "${KOYEB_TOKEN:-}" ] || [ -z "${KOYEB_APP:-}" ] || [ -z "${KOYEB_SERVICE:-}" ]; then
            echo "Koyeb secrets are not configured; skipping CLI install."
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy image to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_APP: ${{ secrets.KOYEB_APP }}
          KOYEB_SERVICE: ${{ secrets.KOYEB_SERVICE }}
          KOYEB_GHCR_SECRET: ${{ secrets.KOYEB_GHCR_SECRET }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          if [ -z "${KOYEB_TOKEN:-}" ] || [ -z "${KOYEB_APP:-}" ] || [ -z "${KOYEB_SERVICE:-}" ]; then
            echo "Koyeb secrets are not configured; image was pushed but deploy was skipped."
            exit 0
          fi

          args=(
            --docker "$IMAGE"
            --ports "8080:http"
            --routes "/:8080"
            --checks "8080:http:/actuator/health"
            --env "PORT=8080"
            --env "SPRING_PROFILES_ACTIVE=prod"
          )

          if [ -n "$KOYEB_GHCR_SECRET" ]; then
            args+=(--docker-private-registry-secret "$KOYEB_GHCR_SECRET")
          fi

          if koyeb services get "$KOYEB_APP/$KOYEB_SERVICE" >/dev/null 2>&1; then
            koyeb services update "$KOYEB_APP/$KOYEB_SERVICE" "${args[@]}" --wait
          else
            koyeb services create "$KOYEB_SERVICE" --app "$KOYEB_APP" "${args[@]}" --wait
          fi
