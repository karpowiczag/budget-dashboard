name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to publish'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/budget
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run sync:backend
        working-directory: frontend
      - run: ./mvnw -Pnative -DskipTests native:compile

      - name: Validate deployment secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_PUBLIC_URL: ${{ secrets.RENDER_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in RENDER_API_KEY RENDER_SERVICE_ID RENDER_PUBLIC_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for a release deployment"
              missing=1
            fi
          done
          exit "$missing"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Install Render CLI
        env:
          RENDER_CLI_VERSION: 2.16.0
          RENDER_CLI_SHA256: 3ece121a73a1b222c7bcad3e75af1be2c0a8b285c5850bc635b44c2bdabea915
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip" -o render.zip
          echo "${RENDER_CLI_SHA256}  render.zip" | sha256sum -c -
          unzip -q render.zip
          sudo mv "cli_v${RENDER_CLI_VERSION}" /usr/local/bin/render

      - name: Deploy image to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OUTPUT: json
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          CI: true
        run: |
          set -euo pipefail
          render deploys create "$RENDER_SERVICE_ID" --image "$IMAGE" --wait --output json --confirm

      - name: Smoke deployed health endpoint
        env:
          RENDER_PUBLIC_URL: ${{ secrets.RENDER_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${RENDER_PUBLIC_URL%/}"
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$base/actuator/health"
