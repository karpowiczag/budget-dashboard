name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to publish'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/budget
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run sync:backend
        working-directory: frontend
      - run: ./mvnw -Pnative -DskipTests native:compile

      - name: Validate deployment secrets
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_APP: ${{ secrets.KOYEB_APP }}
          KOYEB_SERVICE: ${{ secrets.KOYEB_SERVICE }}
          KOYEB_PUBLIC_URL: ${{ secrets.KOYEB_PUBLIC_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_ALLOWED_GOOGLE_EMAIL: ${{ secrets.APP_ALLOWED_GOOGLE_EMAIL }}
        run: |
          set -euo pipefail
          missing=0
          for name in KOYEB_TOKEN KOYEB_APP KOYEB_SERVICE KOYEB_PUBLIC_URL DATABASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET APP_ALLOWED_GOOGLE_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for a release deployment"
              missing=1
            fi
          done
          exit "$missing"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Install Koyeb CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy image to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_APP: ${{ secrets.KOYEB_APP }}
          KOYEB_SERVICE: ${{ secrets.KOYEB_SERVICE }}
          KOYEB_GHCR_SECRET: ${{ secrets.KOYEB_GHCR_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_ALLOWED_GOOGLE_EMAIL: ${{ secrets.APP_ALLOWED_GOOGLE_EMAIL }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          args=(
            --docker "$IMAGE"
            --ports "8080:http"
            --routes "/:8080"
            --checks "8080:http:/actuator/health"
            --env "PORT=8080"
            --env "SPRING_PROFILES_ACTIVE=prod"
            --env "DATABASE_URL=$DATABASE_URL"
            --env "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            --env "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            --env "APP_ALLOWED_GOOGLE_EMAIL=$APP_ALLOWED_GOOGLE_EMAIL"
            --env "APP_LOCAL_REBUILD_ENABLED=false"
          )

          if [ -n "$KOYEB_GHCR_SECRET" ]; then
            args+=(--docker-private-registry-secret "$KOYEB_GHCR_SECRET")
          fi

          if koyeb services get "$KOYEB_APP/$KOYEB_SERVICE" >/dev/null 2>&1; then
            koyeb services update "$KOYEB_APP/$KOYEB_SERVICE" "${args[@]}" --wait
          else
            koyeb services create "$KOYEB_SERVICE" --app "$KOYEB_APP" "${args[@]}" --wait
          fi

      - name: Smoke deployed health endpoint
        env:
          KOYEB_PUBLIC_URL: ${{ secrets.KOYEB_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${KOYEB_PUBLIC_URL%/}"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 "$base/actuator/health"
