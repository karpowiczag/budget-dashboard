name: Security or privacy task
description: Track security, privacy, OAuth, upload, or secret-handling work.
title: "[Security]: "
labels: ["type:security", "priority:p1"]
body:
  - type: textarea
    id: concern
    attributes:
      label: Concern
      description: Describe the risk without posting secrets or private data.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected area
      description: OAuth, CSV upload, database, CI secrets, deployment, dependencies, etc.
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Expected mitigation
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include secrets, tokens, raw bank exports, or private transaction details.
          required: true
