name: Bug report
description: Report a defect or regression.
title: "[Bug]: "
labels: ["type:bug", "priority:p2"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend
        - Categorization/data
        - CI/CD
        - Security
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not paste private transaction rows.
      placeholder: |
        1. 
        2. 
        3. 
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, or summarized examples. Redact private financial data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include raw bank exports, secrets, or private transaction details.
          required: true
